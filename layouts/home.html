{{ define "main" }}
{{ .Content }}

{{ $blog := site.GetPage "/blog" }}
{{ with $blog }}
{{ with .Pages }}
<article>
    <h2>Recent Posts</h2>
        <ul>
            {{ range first 10 (sort . "Date" "desc") }}
            <li>
                <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
            </li>
            {{ end }}
        </ul>
</article>
{{ end }}
{{ end }}
{{ end }}
